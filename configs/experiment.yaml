project:
  name: bangla-llm-compression
  seed: 42

paths:
  data_dir: data
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  model_dir: models
  result_dir: results
  raw_result_dir: results/raw
  processed_result_dir: results/processed
  figure_dir: figures
  log_dir: logs


datasets:

  stance:
    file: sentiment.csv
    text_column: comment
    label_column: stance

  fake_news:
    authentic_file: LabeledAuthentic-7K.csv
    fake_file: LabeledFake-1K.csv
    text_columns:
      - headline
      - content
    label_column: label

  nli:
    file: bangla_nli.csv
    columns:
      - Premise
      - Entailment
      - Neutral
      - Contradiction

evaluation:
  primary_metric: macro_f1
  secondary_metrics:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_per_class

  max_new_tokens: 8
  do_sample: false
  temperature: null

  batch_size:
    fp16: 8
    int8: 8
    int4: 8

  max_input_tokens: 4096

experiments:
  quantization:
    - fp16
    - int8
    - int4

  models:
    - name: qwen2.5-0.5b-instruct
      model_id: Qwen/Qwen2.5-0.5B-Instruct
      size: 0.5b

    - name: qwen2.5-1.5b-instruct
      model_id: Qwen/Qwen2.5-1.5B-Instruct
      size: 1.5b

    - name: qwen2.5-3b-instruct
      model_id: Qwen/Qwen2.5-3B-Instruct
      size: 3b

    - name: falcon3-3b-instruct
      model_id: tiiuae/Falcon3-3B-Instruct